; ROYAL PANEL - PHP upload settings (per-directory, read by PHP-FPM / CGI / FastCGI / LiteSpeed LSAPI)
; Needed for Product Video upload (admin -> Store -> Product -> Save).
; NOTE: PHP caches .user.ini for user_ini.cache_ttl seconds (default 300 = 5 min),
;       so a change can take up to 5 minutes to become effective.
; post_max_size must always be >= upload_max_filesize.
upload_max_filesize = 256M
post_max_size = 300M
max_file_uploads = 20
max_input_time = 600
max_execution_time = 600
